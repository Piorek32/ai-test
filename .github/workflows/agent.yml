name: Claude agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: agent-issue-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement:
    name: Implement issue
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent-ready') ||
      (github.event_name != 'issues' &&
       contains(github.event.comment.body, '@claude') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent-ready
          branch_prefix: feat/
          claude_args: |
            --allowedTools "Bash(npm run build),Bash(npm run e2e:*),Bash(npx ng test:*),Bash(npx ng generate:*),Bash(npx prettier:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --disallowedTools "Bash(npm install:*),Bash(npm i:*),Bash(gh pr merge:*),Bash(git push --force:*),Bash(git push -f:*),Edit(.github/**),Edit(.claude/**),Edit(CLAUDE.md)"
            --append-system-prompt "You run in GitHub Actions. Follow CLAUDE.md and the steps of .claude/skills/new-feature/SKILL.md, with these differences: the branch is already created and checked out, so do not switch to main or create another branch; Node 24 and dependencies are already installed, so skip nvm use and npm install. If this run was triggered on an issue: implement it; when build, unit tests and e2e tests pass, push the branch and open a pull request to main with gh pr create, adding 'Closes #<issue number>' to its body. If this run was triggered by a comment on a pull request: make only the changes the comment asks for on the existing pull request branch; when build, unit tests and e2e tests pass, commit and push to that branch, do not open a new pull request, and reply in Polish with what you changed. Never merge the pull request."
