<section class="todos" data-testid="todos">
  <h1>Zadania</h1>

  <form class="add-form" (submit)="$event.preventDefault(); add(input)">
    <input #input type="text" aria-label="Nowe zadanie" data-testid="todo-input" />
    <button type="submit" data-testid="todo-add">Dodaj</button>
  </form>

  <ul class="list" data-testid="todo-list">
    @for (todo of todos(); track todo.id) {
      <li class="item" data-testid="todo-item">
        <label>
          <input
            type="checkbox"
            [checked]="todo.done"
            (change)="toggle(todo.id)"
            data-testid="todo-checkbox"
          />
          <span [class.done]="todo.done" data-testid="todo-text">{{ todo.text }}</span>
        </label>
        <button type="button" (click)="remove(todo.id)" data-testid="todo-remove">Usuń</button>
      </li>
    }
  </ul>

  <p data-testid="todo-remaining">Pozostało: {{ remaining() }}</p>
</section>
